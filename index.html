<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文章題シアター</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--sky1:#DDF0FF;--sky2:#F7FBFF;--card:#FFFFFF;--ink:#1D2A4A;--sub:#5A6886;--line:#D5E0EE;--pink:#E8336D;--blue:#1E7FD6;--green:#2E9E4F;--orange:#F08C1A;--yellow:#FFE45C;
--sF:#D8ECFF;--sS:#2A7BD1;--rF:#FFF4C9;--rS:#D29B00;--pF:#EEF0F4;--pS:#8A93A6;--nF:#FFE0EA;--nS:#E8336D;--amF:#FFD9E5;--isF:#D5E9FF;--areF:#D6F2DF;--plainF:#FFE9D1;--plainS:#E07B00;
--okbg:#E3F6E9;--ok:#23864A;--bugbg:#FFF0D9;--bug:#B86200;--infobg:#EAF3FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky1:#13223A;--sky2:#0F1A2B;--card:#1B2940;--ink:#EAF1FF;--sub:#A9B8D3;--line:#2F4263;--sF:#1D3B63;--sS:#79B3F2;--rF:#4A3D12;--rS:#E8C24A;--pF:#2B3446;--pS:#9AA6BD;--nF:#4C1F30;--nS:#F37AA0;--amF:#4C1F30;--isF:#1D3B63;--areF:#1C4430;--plainF:#4A3316;--plainS:#F2A34A;--okbg:#17392A;--ok:#6BD69C;--bugbg:#3F2E14;--bug:#F2B35A;--infobg:#1C2F4E}}
:root[data-theme="dark"]{--sky1:#13223A;--sky2:#0F1A2B;--card:#1B2940;--ink:#EAF1FF;--sub:#A9B8D3;--line:#2F4263;--sF:#1D3B63;--sS:#79B3F2;--rF:#4A3D12;--rS:#E8C24A;--pF:#2B3446;--pS:#9AA6BD;--nF:#4C1F30;--nS:#F37AA0;--amF:#4C1F30;--isF:#1D3B63;--areF:#1C4430;--plainF:#4A3316;--plainS:#F2A34A;--okbg:#17392A;--ok:#6BD69C;--bugbg:#3F2E14;--bug:#F2B35A;--infobg:#1C2F4E}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:linear-gradient(180deg,var(--sky1),var(--sky2) 320px);background-color:var(--sky2);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:10px 12px 40px}
header{text-align:center;margin:6px 0 14px;position:relative}
.title{display:inline-block;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:6px 18px 8px;box-shadow:0 4px 0 var(--ink)}
.title h1{margin:0;font-size:1.9rem;font-weight:800;line-height:1.2;letter-spacing:.01em}
.title h1 .be{color:var(--pink);font-family:"Nunito",sans-serif;font-weight:900;font-size:2.3rem}
.title h1 .hl{background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.pill{display:inline-block;margin-top:8px;background:#FFE3EE;color:var(--pink);border-radius:99px;padding:2px 16px;font-weight:800;font-size:.9rem}
.xp{position:absolute;right:0;top:0;font-size:.8rem;font-weight:700;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:1px 10px}
.sec{background:var(--card);border:3px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:18px;padding:12px 12px 14px;margin-bottom:12px;background-image:linear-gradient(180deg,color-mix(in srgb,var(--c) 8%,var(--card)),var(--card) 60px)}
.sec h2,.shead{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:1.15rem;font-weight:800}
.num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:"Nunito",sans-serif;font-weight:900;font-size:1.15rem;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.shead{background:var(--c);color:#fff;border-radius:99px;padding:3px 14px 3px 4px;display:inline-flex}
.shead .num{background:#fff;color:var(--c);box-shadow:none;width:28px;height:28px;font-size:1rem}
.legend{display:grid;gap:6px}
.lg{display:flex;align-items:center;gap:8px;border-radius:99px;padding:4px 14px;font-weight:800;font-size:1.05rem}
.lg b:nth-child(3){font-family:"Nunito",sans-serif;font-size:1.3rem}
.lg i{margin-left:auto;font-style:normal;font-size:1.3rem}
.lg.am{background:var(--amF);color:var(--pink)}.lg.is{background:var(--isF);color:var(--blue)}.lg.are{background:var(--areF);color:var(--green)}
.note{font-size:.84rem;color:var(--sub);margin:8px 0 0}
.stages{display:grid;gap:10px;margin-bottom:12px}
.stage{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);color:var(--ink);border:3px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:16px;padding:10px 12px;font:inherit;cursor:pointer;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 40%,transparent)}
.stage:active{transform:translateY(2px);box-shadow:none}
.st{flex:1;display:flex;flex-direction:column}.st b{font-size:1.05rem}.st small{color:var(--sub);font-size:.8rem;line-height:1.45}
.sb{font-size:.72rem;font-weight:800;color:var(--c);text-align:center;line-height:1.3}
.zukan{list-style:none;padding:0;margin:0}.zukan li{display:flex;justify-content:space-between;border-bottom:2px dotted var(--line);padding:6px 2px}.zukan b{color:var(--bug)}
.top{margin-bottom:6px}.back{border:0;background:none;color:var(--sub);font:inherit;font-weight:700;cursor:pointer;padding:2px 0}
.prog{display:flex;gap:5px;margin:8px 0 6px}.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}.prog .done{background:var(--c)}.prog .now{background:color-mix(in srgb,var(--c) 45%,var(--line))}
.task{font-weight:800;margin:8px 0}
.q{font-weight:800;font-size:.92rem;margin:10px 0 6px;color:var(--sub)}
.ja{margin:6px 0 8px;background:#FFF9D6;border-radius:12px;padding:6px 12px;color:#3A3000}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ja{background:#3A3416;color:#FFF3B8}}
:root[data-theme="dark"] .ja{background:#3A3416;color:#FFF3B8}
.ja.big{font-size:1.1rem}.big{font-size:1.2rem}
.stagebox{min-height:72px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:10px 6px;border-radius:14px;background:repeating-linear-gradient(45deg,transparent 0 10px,color-mix(in srgb,var(--c) 5%,transparent) 10px 20px);margin:6px 0}
/* pieces */
.pw{display:inline-block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;line-height:0}
.pc{overflow:visible;display:block;filter:drop-shadow(0 2px 0 rgba(0,0,0,.18))}
.pc path{stroke-width:2.5;stroke-linejoin:round}
.pc text{font-family:"Nunito",sans-serif;font-weight:800;font-size:22px;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.r-s path{fill:var(--sF);stroke:var(--sS)}
.r-r path{fill:var(--rF);stroke:var(--rS)}
.r-p path{fill:var(--pF);stroke:var(--pS)}
.r-not path{fill:var(--nF);stroke:var(--nS)}.r-not text{fill:var(--pink)}
.r-be path{fill:var(--plainF);stroke:var(--plainS)}
.b-am path{fill:var(--amF);stroke:var(--pink)}.b-am text{fill:var(--pink)}
.b-is path{fill:var(--isF);stroke:var(--blue)}.b-is text{fill:var(--blue)}
.b-are path{fill:var(--areF);stroke:var(--green)}.b-are text{fill:var(--green)}
.pline{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px}
.pline .pw.join{margin-left:-15px}
.pline .pw.gap{margin-left:6px}
.pline .pw.gap .pc path{stroke-dasharray:5 4}
.pline.snap{animation:snap .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes snap{0%{transform:scale(.94)}100%{transform:scale(1)}}
.pc.appear{animation:appear .4s ease-out}
@keyframes appear{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.pw.dim{opacity:.35}
.pw.bugmark .pc{filter:drop-shadow(0 0 0 transparent)}
.pw.bugmark .pc path{stroke:var(--bug);stroke-width:4;fill:var(--bugbg)}
.pw.lift{opacity:.25}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:scale(1.08) rotate(-3deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.25))}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{font:inherit;font-weight:800;min-height:60px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px}
.cat .emo{font-size:1.6rem}
.cat.no{background:var(--bugbg);border-color:var(--bug)}
.bes{display:flex;flex-wrap:wrap;gap:12px}
.board{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.slot{position:relative;min-width:74px;min-height:78px;border:3px dashed color-mix(in srgb,var(--c) 45%,var(--line));border-radius:14px;display:flex;align-items:flex-end;justify-content:center;padding:18px 4px 4px;background:color-mix(in srgb,var(--c) 4%,var(--card))}
.slot small{position:absolute;top:2px;left:8px;font-size:.7rem;font-weight:800;color:var(--sub)}
.slot.full{border-style:solid;border-color:var(--ok)}
.slot.front{min-width:66px;min-height:70px}
.pool{display:flex;flex-wrap:wrap;gap:10px;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--c) 7%,var(--card));border:2px solid var(--line);min-height:84px}
.choices{display:grid;gap:8px}
.opt{font-family:"Nunito",sans-serif;font-weight:800;font-size:1.2rem;text-align:left;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);cursor:pointer}
.opt.no{background:var(--bugbg);border-color:var(--bug)}
#inp{width:100%;font-family:"Nunito",sans-serif;font-weight:800;font-size:1.3rem;padding:10px 14px;border:3px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
#inp:focus{outline:none;border-color:var(--c)}
.msg{min-height:1.4em;margin:10px 0 4px;border-radius:12px;font-weight:700}
.msg.bug{background:var(--bugbg);padding:8px 12px;border:2px solid var(--bug)}
.msg.ok{background:var(--okbg);padding:8px 12px;border:2px solid var(--ok)}
.msg.info{background:var(--infobg);padding:8px 12px;border:2px solid var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.row button{font:inherit;font-weight:800;min-height:48px;padding:8px 20px;border-radius:99px;border:3px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.row button:active{transform:translateY(2px);box-shadow:none}
button.primary{background:var(--c,var(--pink))!important;border-color:color-mix(in srgb,var(--c,var(--pink)) 70%,#000)!important;color:#fff!important;box-shadow:0 3px 0 color-mix(in srgb,var(--c,var(--pink)) 60%,#000)!important}
.mission{border:3px solid var(--pink);border-radius:16px;padding:6px 14px;margin:10px 0;background:#FFF1F6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mission{background:#3A1A27}}
:root[data-theme="dark"] .mission{background:#3A1A27}
.mission h3{margin:6px 0 2px;color:var(--pink);font-size:1rem}
button:focus-visible,.pw:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake,.pline.snap,.pc.appear{animation:none}}

.guide{display:flex;align-items:flex-end;gap:6px;margin:10px 0 4px}
.guide #chara{flex:0 0 84px;line-height:0}
.guide .bubble{flex:1;position:relative;margin:0 0 18px;background:var(--card);border:2.5px solid var(--line);border-radius:16px;padding:8px 12px;min-height:44px;font-weight:700}
.guide .bubble::before{content:"";position:absolute;left:-11px;bottom:12px;border:8px solid transparent;border-right:11px solid var(--line);border-left:0}
.guide .bubble::after{content:"";position:absolute;left:-7px;bottom:13px;border:7px solid transparent;border-right:9px solid var(--card);border-left:0}
.guide .bubble.bug{background:var(--bugbg);border-color:var(--bug)}.guide .bubble.bug::before{border-right-color:var(--bug)}.guide .bubble.bug::after{border-right-color:var(--bugbg)}
.guide .bubble.ok{background:var(--okbg);border-color:var(--ok)}.guide .bubble.ok::before{border-right-color:var(--ok)}.guide .bubble.ok::after{border-right-color:var(--okbg)}
.guide .bubble.info{background:var(--infobg);border-color:var(--blue)}.guide .bubble.info::before{border-right-color:var(--blue)}.guide .bubble.info::after{border-right-color:var(--infobg)}
.guide.hello{margin:0 0 10px}
#chara.hop{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-10px)}100%{transform:translateY(0)}}
.kid.think{animation:tilt 1.6s ease-in-out infinite alternate;transform-origin:50% 90%}
@keyframes tilt{from{transform:rotate(-2deg)}to{transform:rotate(3deg)}}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
.toggles{display:grid;gap:6px}
.tg{display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:700;border:2.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--sub);padding:8px 12px;cursor:pointer}
.tg b{font-family:"Nunito",sans-serif;font-weight:900;border-radius:99px;padding:0 10px;background:var(--line);color:var(--sub)}
.tg.on{color:var(--ink);border-color:color-mix(in srgb,var(--c) 55%,var(--line))}.tg.on b{background:var(--c);color:#fff}
body.nomotion *,body.nomotion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#chara.hop,.kid.think{animation:none}}

// ---- chase ----
const PAIRS=[['弟','兄'],['妹','姉'],['姉','妹'],['兄','弟']];
function genChase(lv){const V1=[50,60,70,80],V2=[90,100,110,120,150],Ts=[3,4,5,6,8];let p;

  p.animTalk=`${e}が先に出発。${t} 分後に${l}が追いかける。よく見ていてね。`;
  p.anim=async(box,cap,done)=>{const W=340,H=170,road=96,goal=290;
    box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="asvg"><text x="12" y="${road+28}" font-size="22">🏠</text><line x1="40" y1="${road}" x2="330" y2="${road}" stroke="#c5d2e2" stroke-width="8" stroke-linecap="round"/>

     <rect id="be" x="40" y="${road+22}" height="14" rx="5" width="0" fill="#ffd9e5" stroke="#e8336d" stroke-width="2"/><text id="bet" x="44" y="${road+33}" font-size="10" font-weight="900" fill="#1d2a4a"></text>
     <rect id="bl" y="${road+42}" height="14" rx="5" width="0" fill="#d5e9ff" stroke="#1e7fd6" stroke-width="2"/><text id="blt" y="${road+53}" font-size="10" font-weight="900" fill="#1d2a4a"></text>
     <g id="gap" opacity="0"><rect x="40" y="${road+42}" height="14" rx="5" fill="none" stroke="#8a93a6" stroke-width="2" stroke-dasharray="4 3" id="gapr"/><text id="gapt" y="${road+53}" font-size="10" font-weight="900" fill="#5a6886"></text></g>
     <g id="meet" opacity="0"><path id="brace" stroke="#f0b400" stroke-width="4" fill="none"/><text id="mt" x="${W/2}" y="52" text-anchor="middle" font-size="14" font-weight="900" fill="#b88600">追いついた！ 2人の道のりは同じ</text></g></svg>`;
    const T=p.x,sx=d=>40+(goal-40)*d/p.D,tx=m=>40+(goal-40)*m/T;
    const pe=box.querySelector('#pe'),pl=box.querySelector('#pl'),clk=box.querySelector('#clk');
    const set=(m)=>{const d1=v1*m,d2=v2*Math.max(0,m-t);pe.setAttribute('transform',`translate(${sx(d1)},${road-18})`);pl.setAttribute("transform",`translate(${sx(d2)},${road+4})`);
      box.querySelector('#be').setAttribute('width',tx(m)-40);if(m>=t){box.querySelector('#bl').setAttribute('x',tx(t));box.querySelector('#bl').setAttribute('width',tx(m)-tx(t))}};

    const g=box.querySelector('#gap');g.setAttribute('opacity','1');box.querySelector('#gapr').setAttribute('width',tx(t)-40);const gt=box.querySelector('#gapt');gt.setAttribute('x',44);gt.textContent=`${t}分`;
    await sleep(900);clk.textContent='';
    await tween(2600,k=>set(t+(T-t)*k));

      <rect x="0" y="0" width="340" height="112" fill="url(#gp)"/><rect x="0" y="122" width="340" height="40" fill="url(#gp)"/>
      <text x="8" y="30" font-size="25" font-family="Noto Serif CJK JP" transform="rotate(-1 8 30)">4<tspan font-style="italic">x</tspan>+2=5<tspan font-style="italic">x</tspan>-3</text>
      <text x="44" y="63" font-size="19" font-family="Noto Serif CJK JP" transform="rotate(1.5 44 63)">4<tspan font-style="italic">x</tspan>-5<tspan font-style="italic">x</tspan>=-3-2 → -<tspan font-style="italic">x</tspan>=-5</text>
      <text x="40" y="100" font-size="24" font-family="Noto Serif CJK JP" transform="rotate(-2 40 100)">=5</text>
      <text x="8" y="150" font-size="18" font-family="Noto Serif CJK JP">検 4<tspan font-style="italic">x</tspan>5+2=22　5<tspan font-style="italic">x</tspan>5-3=22</text>
      <text x="8" y="212" font-size="15" font-weight="bold">答えの欄　生徒</text><rect x="122" y="192" width="40" height="30" fill="#fff" stroke="#1d2a4a" stroke-width="2"/><text x="170" y="212" font-size="15" font-weight="bold">鉛筆</text><rect x="208" y="192" width="40" height="30" fill="#fff" stroke="#1d2a4a" stroke-width="2"/><text x="228" y="214" font-size="18" text-anchor="middle" font-weight="bold">5</text>
      <rect x="0" y="0" width="340" height="240" fill="transparent" id="bg"/>
      ${spots.map(s=>`<rect class="hot" data-id="${s.id}" x="${s.x}" y="${s.y}" width="${s.w}" height="${s.h}" rx="6"/>`).join('')}<g id="marks"></g></svg>`;
    sh('③ バグさがし',`<p class="q">この書き方には <b>バグが6つ</b>。タップして全部見つけよう！</p><div class="badwrap">${svg}</div><p class="cnt2">見つけたバグ <b id="fc">0</b> / 6</p><ol class="foundl" id="fl"></ol>`);
    setMsg('文字のはみ出し、マイナス、1行の操作の数、＝、（　）、答えの欄。','info');
    $('#bg').onclick=()=>setMsg('そこはバグじゃないよ。ほかを探そう。','');
    document.querySelectorAll('.hot').forEach(h=>h.onclick=()=>{const id=+h.dataset.id;if(found.has(id))return;found.add(id);sfx('snap');const sp=spots.find(s=>s.id===id);
      h.classList.add('hit');$('#marks').insertAdjacentHTML('beforeend',`<circle cx="${sp.x+sp.w-8}" cy="${sp.y+8}" r="9" fill="#e5485b"/><text x="${sp.x+sp.w-8}" y="${sp.y+12}" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">${'①②③④⑤⑥'[id-1]}</text>`);
      $('#fc').textContent=found.size;$('#fl').insertAdjacentHTML('beforeend',`<li>${sp.msg}</li>`);setMsg(sp.msg,'info');
      if(found.size===6){confetti(false);sfx('ok');setMsg('6つ全部見つけた！ 直すと、こうなる。','ok');$('#acts').innerHTML='<button class="primary" id="fx">直した例を見る →</button>';$('#fx').onclick=fixed}})}
  function fixed(){sh('④ 直すと、こうなる',`${goodExample()}<div class="sixchk"><b>紙に書いたら、毎回この6つ</b><ol>${RULES.map(r=>`<li>${r.t}</li>`).join('')}</ol></div>`);
    S.done.rules=(S.done.rules||0)+1;S.xp+=10;save();$('#xp').textContent=S.xp;sfx('clear');confetti(true);
    setMsg(S.day===2?`クリア！ ○✕クイズ ノーミス ${cur.clean} / 6。紙を書く前に、結果レポートの2〜3ページ目（書き方の見本）も見ておこう。`:`クリア！ ○✕クイズ ノーミス ${cur.clean} / 6。この6つは、Day2 で紙に書くときに使うよ。`,'ok');
    $('#acts').innerHTML='<button class="primary" id="hm">メニューへ</button>';$('#hm').onclick=home}
}

$('#xp').textContent=S.xp;applyOpt();home();
</script></body></html>
